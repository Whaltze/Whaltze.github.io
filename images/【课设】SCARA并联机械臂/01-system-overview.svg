<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SCARA 并联机械臂系统架构</title><desc id="desc">从 PySide6 上位机到 STM32、双 DM556、双步进电机、五杆机构与激光末端的信号和能量关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round}.dash{stroke-dasharray:10 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1600" height="900"/><text class="title" x="70" y="65">SCARA 并联机械臂：从轨迹到末端运动</text><text class="sub" x="70" y="100">蓝色表示控制与通信，红色表示动力电源，绿色表示安全断电链路</text>
<rect class="panel" x="55" y="145" width="1490" height="665" rx="24"/>
<rect class="blue" x="95" y="230" width="270" height="250" rx="18"/><text class="h center" x="230" y="278">PySide6 上位机</text><text class="t center" x="230" y="325">轨迹生成 / 预览</text><text class="t center" x="230" y="360">工作空间检查</text><text class="t center" x="230" y="395">GRBL 字符计数流控</text><text class="s center mono" x="230" y="440">G0 / G1 / G2 / G3</text>
<rect class="blue" x="470" y="200" width="300" height="310" rx="18"/><text class="h center" x="620" y="248">STM32F103</text><text class="t center" x="620" y="292">G-code 解析与规划</text><text class="t center" x="620" y="327">五杆逆解与限位检查</text><text class="t center" x="620" y="362">TIM1 / TIM4 STEP</text><text class="t center" x="620" y="397">GPIO DIR / ENA</text><text class="t center" x="620" y="432">HOME / 激光安全状态</text><text class="s center mono" x="620" y="476">0.29.12-grbl-scara</text>
<rect class="purple" x="875" y="190" width="250" height="150" rx="18"/><text class="h center" x="1000" y="235">DM556 × 2</text><text class="t center" x="1000" y="278">光耦 PUL / DIR / ENA</text><text class="s center" x="1000" y="312">共阳，低电平吸电流</text>
<rect class="amber" x="875" y="410" width="250" height="150" rx="18"/><text class="h center" x="1000" y="455">步进电机 × 2</text><text class="t center" x="1000" y="498">A± / B± 两相绕组</text><text class="s center" x="1000" y="532">开环位置：靠脉冲计数估算</text>
<rect class="green" x="1240" y="240" width="250" height="240" rx="18"/><text class="h center" x="1365" y="285">五杆并联机构</text><text class="t center" x="1365" y="330">基座 150 mm</text><text class="t center" x="1365" y="365">主动臂 160 mm</text><text class="t center" x="1365" y="400">从动臂 200 mm</text><text class="s center" x="1365" y="440">末端：画笔 / 激光</text>
<rect class="red" x="875" y="640" width="615" height="110" rx="18"/><text class="h" x="910" y="686">激光安全链</text><text class="t" x="910" y="724">12 V+ → 保险 → 实体急停 → 继电器 COM/NO → 激光；PA7 仅提供 PWM</text>
<path class="signal" d="M365 350H470" marker-end="url(#blueArrow)"/><text class="tag center" x="418" y="333">USB-UART</text><path class="signal" d="M770 280H875" marker-end="url(#blueArrow)"/><text class="tag center" x="822" y="262">STEP/DIR/ENA</text><path class="wire" d="M1000 340V410" marker-end="url(#arrow)"/><text class="tag" x="1018" y="383">相电流</text><path class="wire" d="M1125 485H1240" marker-end="url(#arrow)"/><text class="tag center" x="1182" y="468">关节转矩</text><path class="safe" d="M770 455C820 520 800 680 875 695" marker-end="url(#arrow)"/><text class="tag" x="790" y="600">PA2 / PA7</text><path class="safe" d="M1490 695V480" marker-end="url(#arrow)"/><text class="tag right" x="1472" y="595">受控出光</text>
<text class="s" x="95" y="780">关键边界：上位机生成真实 G-code；MCU 完成队列、look-ahead、SCARA 分段逆解与 STEP 输出。系统没有关节编码器，不能把软件坐标称为真实闭环反馈。</text></svg>