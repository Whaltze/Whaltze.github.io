<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">五杆并联 SCARA 几何与装配分支</title><desc id="desc">左右基座、主动臂、从动臂、肘点和末端点的几何关系，并标出项目采用的左右肘分支。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round}.dash{stroke-dasharray:10 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1500" height="900"/><text class="title" x="65" y="65">五杆并联机构的几何关系</text><text class="sub" x="65" y="100">本文坐标采用左电机为 UI X=0、右电机为 UI X=150 mm；MCU 坐标在中点平移 75 mm</text>
<rect class="panel" x="55" y="140" width="920" height="675" rx="24"/><line x1="155" y1="735" x2="875" y2="735" stroke="#94a3b8" stroke-width="3"/><line x1="185" y1="765" x2="185" y2="220" stroke="#94a3b8" stroke-width="3"/><text class="s" x="875" y="765">X</text><text class="s" x="155" y="230">Y</text>
<circle cx="285" cy="680" r="14" fill="#dc2626"/><circle cx="735" cy="680" r="14" fill="#2563eb"/><text class="h center" x="285" y="725">O₁</text><text class="h center" x="735" y="725">O₂</text><line x1="285" y1="680" x2="735" y2="680" stroke="#334155" stroke-width="5"/><text class="t center" x="510" y="710">B = 150 mm</text>
<line x1="285" y1="680" x2="390" y2="365" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/><line x1="735" y1="680" x2="625" y2="365" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/><circle cx="390" cy="365" r="13" fill="#dc2626"/><circle cx="625" cy="365" r="13" fill="#2563eb"/><text class="h" x="330" y="340">E₁</text><text class="h" x="640" y="340">E₂</text><text class="t" x="265" y="475" transform="rotate(-72 265 475)">L₁ = 160 mm</text><text class="t" x="685" y="470" transform="rotate(70 685 470)">L₁ = 160 mm</text>
<line x1="390" y1="365" x2="510" y2="235" stroke="#f97316" stroke-width="16" stroke-linecap="round"/><line x1="625" y1="365" x2="510" y2="235" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/><circle cx="510" cy="235" r="17" fill="#16a34a"/><text class="h" x="535" y="225">P(x,y)</text><text class="t" x="383" y="275" transform="rotate(-47 383 275)">L₂ = 200 mm</text><text class="t" x="575" y="275" transform="rotate(48 575 275)">L₂ = 200 mm</text>
<path d="M340 680 A55 55 0 0 0 302 628" fill="none" stroke="#dc2626" stroke-width="4"/><text class="t" x="340" y="640">θ₁</text><path d="M680 680 A55 55 0 0 1 720 628" fill="none" stroke="#2563eb" stroke-width="4"/><text class="t" x="655" y="640">θ₂</text>
<rect class="blue" x="1035" y="175" width="405" height="230" rx="18"/><text class="h center" x="1238" y="220">当前项目逆解分支</text><text class="t" x="1080" y="270">左肘：APP_SCARA_IK_LEFT_ELBOW_SIGN = +1</text><text class="t" x="1080" y="315">右肘：APP_SCARA_IK_RIGHT_ELBOW_SIGN = −1</text><text class="s" x="1080" y="360">连续轨迹必须维持相同分支，不能逐点任意挑另一个数学解。</text>
<rect class="red" x="1035" y="465" width="405" height="245" rx="18"/><text class="h center" x="1238" y="510">奇异位形警告</text><text class="t" x="1080" y="560">• 任一侧主动臂和从动臂接近共线</text><text class="t" x="1080" y="602">• 机构从一个装配构型跨到另一个构型</text><text class="t" x="1080" y="644">• 末端可能损失自由度或关节速度突增</text><text class="s" x="1080" y="682">先求安全工作空间，再在空间内规划连续轨迹。</text>
<text class="s" x="65" y="855">几何图为本项目参数的原理示意；真实零点、方向、关节限位和装配误差以实机标定为准。</text></svg>