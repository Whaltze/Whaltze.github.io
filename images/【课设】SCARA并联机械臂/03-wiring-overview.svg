<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc"><title id="title">SCARA 控制系统完整接线总览</title><desc id="desc">STM32F103、两台 DM556、四线步进电机、限位、USB-UART、ST-Link 和激光安全链的完整接线与电源分区。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signalHalo{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round}.logic{fill:none;stroke:#d97706;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round}.dash{stroke-dasharray:10 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1800" height="1180"/><text class="title" x="60" y="62">完整接线总览：先分电源域，再接信号</text><text class="sub" x="60" y="98">红线为正电源，黑线为负极/参考地，蓝线为 MCU 控制信号；所有端子以实物丝印为准</text>
<rect class="panel" x="45" y="130" width="1710" height="965" rx="24"/>
<rect class="red" x="80" y="190" width="300" height="190" rx="18"/><text class="h center" x="230" y="235">24–48 V 动力电源</text><text class="t" x="115" y="285">+ → M1 VDC+</text><text class="t" x="115" y="322">+ → M2 VDC+</text><text class="t" x="115" y="359">− → 两驱动器 VDC−</text>
<rect class="amber" x="80" y="450" width="300" height="180" rx="18"/><text class="h center" x="230" y="495">稳压 +5V_LOGIC</text><text class="t" x="115" y="543">+ → 两驱动器全部 “+” 输入</text><text class="t" x="115" y="580">− → STM32 GND</text><text class="s" x="115" y="610">只作为光耦公共正端</text>
<rect class="blue" x="500" y="205" width="410" height="530" rx="18"/><text class="h center" x="705" y="250">STM32F103 控制板</text><text class="t mono" x="545" y="300">PA8  → M1 PUL−</text><text class="t mono" x="545" y="335">PB12 → M1 DIR−</text><text class="t mono" x="545" y="370">PB13 → M1 ENA−</text><text class="t mono" x="545" y="420">PB6  → M2 PUL−</text><text class="t mono" x="545" y="455">PB7  → M2 DIR−</text><text class="t mono" x="545" y="490">PB8  → M2 ENA−</text><text class="t mono" x="545" y="540">PB0  ← HOME1 NO</text><text class="t mono" x="545" y="575">PB1  ← HOME2 NO</text><text class="t mono" x="545" y="625">PA9/PA10 ↔ UART</text><text class="t mono" x="545" y="660">PA2 / PA7 → 激光控制</text><text class="s" x="545" y="705">板卡供电按开发板丝印；不要把 5V 接入 3V3。</text>
<rect class="purple" x="1035" y="165" width="310" height="310" rx="18"/><text class="h center" x="1190" y="208">DM556 · M1</text><text class="t mono" x="1080" y="253">PUL+ DIR+ ENA+ ← +5V</text><text class="t mono" x="1080" y="292">PUL− ← PA8</text><text class="t mono" x="1080" y="327">DIR− ← PB12</text><text class="t mono" x="1080" y="362">ENA− ← PB13</text><text class="t mono" x="1080" y="407">A± / B± → 电机 M1</text><text class="s" x="1080" y="443">动力端接 24–48 V</text>
<rect class="purple" x="1035" y="535" width="310" height="310" rx="18"/><text class="h center" x="1190" y="578">DM556 · M2</text><text class="t mono" x="1080" y="623">PUL+ DIR+ ENA+ ← +5V</text><text class="t mono" x="1080" y="662">PUL− ← PB6</text><text class="t mono" x="1080" y="697">DIR− ← PB7</text><text class="t mono" x="1080" y="732">ENA− ← PB8</text><text class="t mono" x="1080" y="777">A± / B± → 电机 M2</text><text class="s" x="1080" y="813">动力端接 24–48 V</text>
<rect class="green" x="1440" y="220" width="250" height="190" rx="18"/><text class="h center" x="1565" y="265">四线电机 M1</text><text class="t center" x="1565" y="312">线圈 1 → A+ / A−</text><text class="t center" x="1565" y="350">线圈 2 → B+ / B−</text><text class="s center" x="1565" y="385">颜色必须实测</text>
<rect class="green" x="1440" y="590" width="250" height="190" rx="18"/><text class="h center" x="1565" y="635">四线电机 M2</text><text class="t center" x="1565" y="682">线圈 1 → A+ / A−</text><text class="t center" x="1565" y="720">线圈 2 → B+ / B−</text><text class="s center" x="1565" y="755">断电后才可换线</text>
<rect class="blue" x="80" y="720" width="330" height="300" rx="18"/><text class="h center" x="245" y="765">低压接口</text><text class="s" x="105" y="815">HOME1：COM→GND，NO→PB0</text><text class="s" x="105" y="855">HOME2：COM→GND，NO→PB1</text><text class="s" x="105" y="895">UART：TXD→PA10，RXD←PA9</text><text class="s" x="105" y="935">SWD：IO→PA13，CLK→PA14</text><text class="xs" x="105" y="975">全部先接 GND / Vref，再开始通信</text>
<rect class="red" x="500" y="825" width="845" height="195" rx="18"/><text class="h center" x="922" y="870">激光 12 V 安全链</text><text class="t" x="545" y="920">12V+ → 保险 → 实体急停 → 继电器 COM → NO → 激光正极</text><text class="t" x="545" y="958">激光负极 → 12V−；PA7 → 电平转换/光耦 → PWM；PA2 → 继电器 IN</text><text class="s" x="545" y="995">激光 12 V 最后接入；未确认 PWM 电压前禁止 PA7 直连。</text>
<path class="power" d="M380 245H430V150H1190V165" marker-end="url(#redArrow)"/>
<path class="power" d="M380 320H430V810H1035" marker-end="url(#redArrow)"/>
<path class="logic" d="M380 525H470V180H1000V230H1035" marker-end="url(#amberArrow)"/>
<path class="logic" d="M380 525H470V770H990V610H1035" marker-end="url(#amberArrow)"/>
<path class="signalHalo" d="M910 320H1035"/><path class="signal" d="M910 320H1035"/>
<path class="signalHalo" d="M910 690H1035"/><path class="signal" d="M910 690H1035"/>
<path class="wire" d="M1345 320H1440" marker-end="url(#arrow)"/><path class="wire" d="M1345 690H1440" marker-end="url(#arrow)"/>
<path class="ground dash" d="M380 585H500" marker-end="url(#arrow)"/>
<text class="s" x="75" y="1070">重要：动力侧负极是否与保护地/机壳连接，按电源与整机接地设计处理；本文要求的“共地”特指 STM32、5V_LOGIC−、UART GND、HOME COM，以及非隔离激光 PWM 的信号参考。</text></svg>