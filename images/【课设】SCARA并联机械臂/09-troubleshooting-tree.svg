<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title desc"><title id="title">SCARA 常见故障排查路径</title><desc id="desc">针对电机不转、电机抖动、限位异常、串口和激光继电器异常的分支排查步骤。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.dark{fill:#172033;stroke:#0f172a;stroke-width:3}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.dot{stroke-dasharray:4 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.xs{font-size:15px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.white{fill:#fff}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1800" height="1160"/><text class="title" x="60" y="62">故障排查：先分电气、协议、机械，再改参数</text><text class="sub" x="60" y="99">每次只改变一个变量；涉及端子换线时必须先切断对应动力电源</text><rect class="panel" x="45" y="135" width="1710" height="945" rx="24"/>
<g><rect class="red" x="85" y="185" width="390" height="105" rx="18"/><text class="h center" x="280" y="230">症状 1：电机完全不转</text><text class="s center" x="280" y="265">无锁轴、无动作或驱动报警</text><rect class="blue" x="85" y="345" width="390" height="145" rx="18"/><text class="t" x="120" y="385">① 测驱动器动力电压</text><text class="t" x="120" y="425">② 查 ENABLE 与错误位</text><text class="t" x="120" y="465">③ 示波器查 PUL− 脉冲</text><path class="wire" d="M280 290V345" marker-end="url(#arrow)"/><rect class="amber" x="85" y="545" width="390" height="165" rx="18"/><text class="t" x="120" y="588">无脉冲：查 PA8/PB6、TIM、</text><text class="t" x="120" y="625">串口命令是否被拒绝。</text><text class="t" x="120" y="665">有脉冲：查 +5V 共阳、ENA、</text><text class="t" x="120" y="702">驱动报警和电机相线。</text><path class="wire" d="M280 490V545" marker-end="url(#arrow)"/><rect class="green" x="85" y="770" width="390" height="190" rx="18"/><text class="h center" x="280" y="815">修复后判据</text><text class="t" x="120" y="858">低速点动可启动、可停止，</text><text class="t" x="120" y="895">ENABLE 0 后电机释放，</text><text class="t" x="120" y="932">驱动器无报警灯。</text><path class="safe" d="M280 710V770" marker-end="url(#greenArrow)"/></g>
<g><rect class="red" x="500" y="185" width="390" height="105" rx="18"/><text class="h center" x="695" y="230">症状 2：只抖动或啸叫</text><text class="s center" x="695" y="265">锁轴但不连续转，转矩很小</text><rect class="blue" x="500" y="345" width="390" height="145" rx="18"/><text class="t" x="535" y="385">① 完全断电</text><text class="t" x="535" y="425">② 万用表重找两组线圈</text><text class="t" x="535" y="465">③ 核对细分与 6400 PPR</text><path class="wire" d="M695 290V345" marker-end="url(#arrow)"/><rect class="amber" x="500" y="545" width="390" height="165" rx="18"/><text class="t" x="535" y="588">跨线圈混接：最常见。</text><text class="t" x="535" y="625">速度/加速度过大：先降速。</text><text class="t" x="535" y="665">只需改方向：交换同一相</text><text class="t" x="535" y="702">的 +/−，不要重排两相。</text><path class="wire" d="M695 490V545" marker-end="url(#arrow)"/><rect class="green" x="500" y="770" width="390" height="190" rx="18"/><text class="h center" x="695" y="815">修复后判据</text><text class="t" x="535" y="858">空载与装机低速均平顺，</text><text class="t" x="535" y="895">两轴每转脉冲数一致，</text><text class="t" x="535" y="932">无明显失步声。</text><path class="safe" d="M695 710V770" marker-end="url(#greenArrow)"/></g>
<g><rect class="red" x="915" y="185" width="390" height="105" rx="18"/><text class="h center" x="1110" y="230">症状 3：HOME 状态异常</text><text class="s center" x="1110" y="265">始终触发、始终不触发或反向</text><rect class="blue" x="915" y="345" width="390" height="145" rx="18"/><text class="t" x="950" y="385">① 发 HOME_SENSOR</text><text class="t" x="950" y="425">② 手按开关观察 0/1</text><text class="t" x="950" y="465">③ 核对 COM/NO 与 PB0/PB1</text><path class="wire" d="M1110 290V345" marker-end="url(#arrow)"/><rect class="amber" x="915" y="545" width="390" height="165" rx="18"/><text class="t" x="950" y="588">始终低：短路、接到 NC、</text><text class="t" x="950" y="625">输入脚接地。</text><text class="t" x="950" y="665">始终高：断线、COM 未接地、</text><text class="t" x="950" y="702">开关未压到或引脚接错。</text><path class="wire" d="M1110 490V545" marker-end="url(#arrow)"/><rect class="green" x="915" y="770" width="390" height="190" rx="18"/><text class="h center" x="1110" y="815">修复后判据</text><text class="t" x="950" y="858">松开为高、按下为低，</text><text class="t" x="950" y="895">两只开关独立变化；</text><text class="t" x="950" y="932">回零方向与安装位置一致。</text><path class="safe" d="M1110 710V770" marker-end="url(#greenArrow)"/></g>
<g><rect class="red" x="1330" y="185" width="390" height="105" rx="18"/><text class="h center" x="1525" y="230">症状 4：通信 / 继电器异常</text><text class="s center" x="1525" y="265">无回包、乱码、上电瞬间吸合</text><rect class="blue" x="1330" y="345" width="390" height="145" rx="18"/><text class="t" x="1365" y="385">① UART TX/RX 交叉并共地</text><text class="t" x="1365" y="425">② 115200 8N1、3.3 V TTL</text><text class="t" x="1365" y="465">③ 激光断电测 COM-NO</text><path class="wire" d="M1525 290V345" marker-end="url(#arrow)"/><rect class="amber" x="1330" y="545" width="390" height="165" rx="18"/><text class="t" x="1365" y="588">无回包：换 TX/RX、查串口号。</text><text class="t" x="1365" y="625">乱码：查波特率与电平。</text><text class="t" x="1365" y="665">继电器瞬吸：模块有效极性</text><text class="t" x="1365" y="702">与固件配置不一致。</text><path class="wire" d="M1525 490V545" marker-end="url(#arrow)"/><rect class="green" x="1330" y="770" width="390" height="190" rx="18"/><text class="h center" x="1525" y="815">修复后判据</text><text class="t" x="1365" y="858">PING 返回 OK PONG，</text><text class="t" x="1365" y="895">G-code ACK 为小写 ok，</text><text class="t" x="1365" y="932">所有非工作态 COM-NO 断开。</text><path class="safe" d="M1525 710V770" marker-end="url(#greenArrow)"/></g>
<rect class="gray" x="85" y="1010" width="1635" height="95" rx="16"/><text class="t" x="130" y="1050">通用原则：先读取 STATUS / ERRORS / HOME_SENSOR，记录现象；再用万用表或示波器区分“命令没到、脉冲没出、驱动没响应、机械没动”。</text><text class="t" x="130" y="1085">不要用连续提高电流、速度或激光功率来掩盖接线错误；修复后回到低速、单轴、低能量条件重新验证。</text></svg>