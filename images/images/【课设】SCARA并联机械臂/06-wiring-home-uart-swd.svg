<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc"><title id="title">HOME、USB-UART 与 ST-Link 逐线接线</title><desc id="desc">两只常开微动开关、USB 转 TTL 串口和 ST-Link 下载器连接 STM32F103 的逐线示意。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.dark{fill:#172033;stroke:#0f172a;stroke-width:3}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.dot{stroke-dasharray:4 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.xs{font-size:15px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.white{fill:#fff}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1800" height="1120"/><text class="title" x="60" y="62">低压接口逐线接法：HOME、USB-UART、ST-Link</text><text class="sub" x="60" y="99">三组接口可以独立验证；先接地线，再接信号线，最后上电或插入 USB</text><rect class="panel" x="45" y="135" width="1710" height="910" rx="24"/>
<text class="h" x="95" y="190">A. 两只回零微动开关（常开 NO，内部上拉，按下为低电平）</text>
<rect class="blue" x="95" y="225" width="350" height="300" rx="18"/><text class="h center" x="270" y="270">STM32F103</text><text class="t mono" x="140" y="330">PB0 ← HOME1</text><text class="t mono" x="140" y="380">PB1 ← HOME2</text><text class="t mono" x="140" y="445">GND</text><text class="s" x="140" y="487">PB0/PB1 配置为输入上拉</text>
<rect class="green" x="670" y="220" width="350" height="310" rx="18"/><text class="h center" x="845" y="265">HOME1 微动开关</text><text class="t mono" x="730" y="330">NO  → PB0</text><text class="t mono" x="730" y="385">COM → GND</text><text class="t mono" x="730" y="440">NC  → 不接</text><text class="s" x="730" y="490">松开：PB0=高；按下：PB0=低</text>
<rect class="green" x="1280" y="220" width="350" height="310" rx="18"/><text class="h center" x="1455" y="265">HOME2 微动开关</text><text class="t mono" x="1340" y="330">NO  → PB1</text><text class="t mono" x="1340" y="385">COM → GND</text><text class="t mono" x="1340" y="440">NC  → 不接</text><text class="s" x="1340" y="490">松开：PB1=高；按下：PB1=低</text>
<path class="signal" d="M445 325H670" marker-end="url(#blueArrow)"/><text class="tag center" x="557" y="307">PB0 → HOME1 NO</text><path class="signal" d="M445 375H590V590H1190V325H1280" marker-end="url(#blueArrow)"/><text class="tag" x="600" y="573">PB1 → HOME2 NO</text><path class="ground" d="M445 445H535V485H670"/><path class="ground" d="M535 485V620H1225V385H1280"/><text class="tag" x="555" y="615">两只 COM 汇接 STM32 GND</text>
<line x1="80" y1="660" x2="1720" y2="660" stroke="#cbd5e1" stroke-width="2"/>
<text class="h" x="95" y="710">B. USB-UART（3.3 V TTL，115200 8N1）</text><rect class="purple" x="95" y="750" width="430" height="225" rx="18"/><text class="h center" x="310" y="795">USB 转 TTL 模块</text><text class="t mono" x="155" y="850">TXD</text><text class="t mono" x="155" y="895">RXD</text><text class="t mono" x="155" y="940">GND</text><rect class="blue" x="660" y="750" width="430" height="225" rx="18"/><text class="h center" x="875" y="795">STM32 USART1</text><text class="t mono" x="720" y="850">PA10 / RX</text><text class="t mono" x="720" y="895">PA9  / TX</text><text class="t mono" x="720" y="940">GND</text><path class="signal" d="M525 845H660" marker-end="url(#blueArrow)"/><text class="tag center" x="592" y="827">TXD → PA10</text><path class="signal" d="M660 890H525" marker-end="url(#blueArrow)"/><text class="tag center" x="592" y="922">PA9 → RXD</text><path class="ground" d="M525 940H660"/>
<text class="h" x="1190" y="710">C. ST-Link / SWD</text><rect class="amber" x="1170" y="750" width="490" height="225" rx="18"/><text class="h center" x="1415" y="795">下载器 ↔ 目标板</text><text class="t mono" x="1225" y="842">SWDIO → PA13</text><text class="t mono" x="1225" y="878">SWCLK → PA14</text><text class="t mono" x="1225" y="914">GND   → GND</text><text class="t mono" x="1225" y="950">Vref  → 3V3；NRST → NRST（可选）</text>
<rect class="red" x="95" y="1000" width="1565" height="65" rx="14"/><text class="t center" x="878" y="1042">禁止：把 USB-UART 的 TX 接 TX、使用 RS-232 电平、把 ST-Link Vref 当作必然供电输出、同时从多个电源脚给开发板反向供电</text></svg>