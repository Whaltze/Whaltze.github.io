<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc"><title id="title">激光电源、安全继电器与 PWM 逐线接线</title><desc id="desc">12伏激光主电源经保险、实体急停和继电器常开触点供电，STM32 的 PA2 控制继电器，PA7 经电平转换控制 PWM。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.dark{fill:#172033;stroke:#0f172a;stroke-width:3}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.dot{stroke-dasharray:4 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.xs{font-size:15px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.white{fill:#fff}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1800" height="1180"/><text class="title" x="60" y="62">激光链路：主电源硬切断，PWM 只负责调制</text><text class="sub" x="60" y="99">下图是接线逻辑，不代表任意继电器板都可直接接 3.3 V；VCC、电平有效方式和隔离方式必须按实物确认</text><rect class="panel" x="45" y="135" width="1710" height="1010" rx="24"/>
<text class="h" x="95" y="190">A. 12 V 主电源回路（先接、先测通断，激光头最后接）</text>
<rect class="red" x="90" y="230" width="230" height="145" rx="18"/><text class="h center" x="205" y="275">12 V 电源</text><text class="t center" x="205" y="320">正极 12V+</text><text class="t center" x="205" y="350">负极 12V−</text>
<rect class="amber" x="405" y="245" width="190" height="105" rx="18"/><text class="h center" x="500" y="288">保险丝</text><text class="s center" x="500" y="322">靠近电源正极</text><rect class="red" x="680" y="245" width="220" height="105" rx="18"/><text class="h center" x="790" y="288">实体急停</text><text class="s center" x="790" y="322">常闭电源触点</text>
<rect class="purple" x="990" y="205" width="360" height="225" rx="18"/><text class="h center" x="1170" y="250">继电器触点侧</text><text class="t mono" x="1050" y="310">COM ← 急停输出</text><text class="t mono" x="1050" y="355">NO  → 激光正极</text><text class="t mono" x="1050" y="400">NC  → 禁止使用</text>
<rect class="green" x="1450" y="220" width="250" height="180" rx="18"/><text class="h center" x="1575" y="265">激光模块</text><text class="t center" x="1575" y="315">红线 / 正极</text><text class="t center" x="1575" y="355">黑线 / 负极</text>
<path class="power" d="M320 285H405" marker-end="url(#redArrow)"/><path class="power" d="M595 285H680" marker-end="url(#redArrow)"/><path class="power" d="M900 285H990" marker-end="url(#redArrow)"/><path class="power" d="M1350 345H1450" marker-end="url(#redArrow)"/><text class="tag center" x="1400" y="328">NO → 红线</text><path class="ground" d="M320 350H360V450H1395V370H1450" marker-end="url(#arrow)"/><text class="tag center" x="675" y="438">12V− → 激光黑线</text>
<line x1="80" y1="475" x2="1720" y2="475" stroke="#cbd5e1" stroke-width="2"/>
<text class="h" x="95" y="530">B. 低压控制回路（激光 12 V 断开时验证）</text><rect class="blue" x="90" y="575" width="355" height="330" rx="18"/><text class="h center" x="267" y="620">STM32F103</text><text class="t mono" x="145" y="680">PA2 → 继电器 IN</text><text class="t mono" x="145" y="730">PA7 / TIM3_CH2</text><text class="t mono" x="145" y="780">GND</text><text class="s" x="145" y="835">当前固件：PA2 高电平吸合</text><text class="s" x="145" y="868">PA7：1 kHz，高电平有效</text>
<rect class="purple" x="610" y="565" width="380" height="350" rx="18"/><text class="h center" x="800" y="610">继电器模块控制侧</text><text class="t mono" x="675" y="670">IN  ← PA2</text><text class="t mono" x="675" y="720">VCC ← 按铭牌供电</text><text class="t mono" x="675" y="770">GND ← 按模块接口</text><text class="s" x="675" y="825">先测：未 ARM、复位、故障时</text><text class="s" x="675" y="855">COM-NO 必须保持断开</text><text class="s" x="675" y="885">若低电平吸合，先改配置再接激光</text>
<rect class="amber" x="1110" y="575" width="270" height="330" rx="18"/><text class="h center" x="1245" y="620">电平转换 / 光耦</text><text class="t center" x="1245" y="680">输入侧 ← PA7</text><text class="t center" x="1245" y="730">输出侧 → PWM</text><text class="s center" x="1245" y="785">电压与极性须实测</text><text class="s center" x="1245" y="825">悬空时保持关闭</text><text class="s center" x="1245" y="865">禁止把 12 V 拉高直送 PA7</text>
<rect class="green" x="1490" y="575" width="210" height="330" rx="18"/><text class="h center" x="1595" y="620">激光控制端</text><text class="t center" x="1595" y="680">PWM 输入</text><text class="t center" x="1595" y="730">黑线参考</text><text class="s center" x="1595" y="790">只有单根 PWM 线时</text><text class="s center" x="1595" y="825">必须以黑线为参考</text><text class="s center" x="1595" y="865">除非采用完整隔离</text>
<path class="signal" d="M445 675H610" marker-end="url(#blueArrow)"/><text class="tag center" x="527" y="657">PA2 → IN</text>
<path class="signal" d="M445 730H540V945H1040V730H1110" marker-end="url(#blueArrow)"/><text class="tag center" x="790" y="938">PA7 → 电平转换 / 光耦</text>
<path class="signal" d="M1380 730H1490" marker-end="url(#blueArrow)"/><text class="tag center" x="1435" y="712">PWM</text>
<path class="ground dash" d="M445 780H520V985H1450V760H1490"/><text class="tag center" x="945" y="1008">非隔离方案：STM32 GND 与激光黑线 / 12V−建立信号参考</text>
<rect class="red" x="90" y="1025" width="1610" height="105" rx="16"/><text class="t" x="135" y="1068">安全判据：上电、复位、未 ARM、STOP、ESTOP、故障和 MCU 失电时，继电器 COM-NO 均应断开；PA7 低电平且无异常脉冲。</text><text class="t" x="135" y="1105">PWM 不能替代保险、实体急停、常开功率断电级、防护罩和对应波长护目镜。调试时使用低功率替代负载，激光头最后接入。</text></svg>