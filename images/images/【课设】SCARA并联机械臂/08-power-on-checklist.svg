<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img" aria-labelledby="title desc"><title id="title">SCARA 首次上电分阶段检查流程</title><desc id="desc">从全断电检查、逻辑侧验证、单轴电机测试，到双轴和激光最后接入的安全调试顺序。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker></defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.dark{fill:#172033;stroke:#0f172a;stroke-width:3}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.dot{stroke-dasharray:4 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.xs{font-size:15px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.white{fill:#fff}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1800" height="1360"/><text class="title" x="60" y="62">首次上电不是“一次全插上”：按八个阶段逐层放行</text><text class="sub" x="60" y="99">任何一步不满足成功判据，都断电回到该步排查；不要带故障继续叠加下一层</text><rect class="panel" x="45" y="135" width="1710" height="1160" rx="24"/>
<rect class="gray" x="95" y="185" width="690" height="165" rx="18"/><circle cx="145" cy="235" r="30" fill="#64748b"/><text class="h center white" x="145" y="244">0</text><text class="h" x="200" y="225">全系统断电，建立“已知安全状态”</text><text class="s" x="200" y="265">拔掉 24–48 V、12 V、USB，激光头保持断开。</text><text class="s" x="200" y="292">机械臂可手动移动，并预留避碰空间。</text><text class="xs" x="200" y="323">工具：万用表、绝缘胶带、端子标号、低功率替代负载。</text>
<rect class="amber" x="1015" y="185" width="690" height="165" rx="18"/><circle cx="1065" cy="235" r="30" fill="#d97706"/><text class="h center white" x="1065" y="244">1</text><text class="h" x="1120" y="225">通断与阻值检查</text><text class="s" x="1120" y="265">断电测量所有电源端子，确认无短路。</text><text class="s" x="1120" y="292">M1/M2 线圈分别配对，并检查相线对机壳绝缘。</text><text class="xs" x="1120" y="323">通过：每组线圈有稳定小电阻，跨组线圈不导通。</text>
<path class="wire" d="M785 267H1015" marker-end="url(#arrow)"/>
<rect class="blue" x="95" y="410" width="690" height="175" rx="18"/><circle cx="145" cy="460" r="30" fill="#2563eb"/><text class="h center white" x="145" y="469">2</text><text class="h" x="200" y="450">只上控制板与 +5V_LOGIC</text><text class="s" x="200" y="490">只给 STM32 与 +5V_LOGIC 上电。</text><text class="s" x="200" y="518">测 3V3、5V 极性，并确认控制侧共参考地。</text><text class="xs" x="200" y="552">通过：无异常发热、焦味或供电波动；驱动器动力侧断开。</text>
<rect class="blue" x="1015" y="410" width="690" height="175" rx="18"/><circle cx="1065" cy="460" r="30" fill="#2563eb"/><text class="h center white" x="1065" y="469">3</text><text class="h" x="1120" y="450">先验证通信、限位与烧录</text><text class="s" x="1120" y="490">先用 ST-Link 烧录，再测试串口命令。</text><text class="s" x="1120" y="518">手按 HOME1/HOME2，核对 HOME_SENSOR 状态。</text><text class="xs" x="1120" y="552">通过：115200 8N1 正常回包，松开与按下可区分。</text>
<path class="wire" d="M1360 350V410" marker-end="url(#arrow)"/><path class="wire" d="M1015 497H785" marker-end="url(#arrow)"/><path class="wire" d="M440 585V650" marker-end="url(#arrow)"/>
<rect class="green" x="95" y="650" width="690" height="185" rx="18"/><circle cx="145" cy="700" r="30" fill="#16a34a"/><text class="h center white" x="145" y="709">4</text><text class="h" x="200" y="690">继电器“干测”，不接激光 12 V</text><text class="s" x="200" y="730">只操作继电器控制侧，激光 12 V 保持断开。</text><text class="s" x="200" y="758">逐项验证上电、复位、未 ARM、STOP、ESTOP 和故障状态。</text><text class="xs" x="200" y="795">通过：COM-NO 始终断开；若上电瞬吸，先修正极性与接口。</text>
<rect class="purple" x="1015" y="650" width="690" height="185" rx="18"/><circle cx="1065" cy="700" r="30" fill="#9333ea"/><text class="h center white" x="1065" y="709">5</text><text class="h" x="1120" y="690">M1 单轴低速测试</text><text class="s" x="1120" y="730">仅给 M1 驱动器上动力电。</text><text class="s" x="1120" y="758">先 ENABLE，再发极小点动，随时准备 STOP。</text><text class="xs" x="1120" y="795">通过：锁轴正常、方向可判定、无持续抖动或驱动报警。</text>
<path class="wire" d="M785 742H1015" marker-end="url(#arrow)"/>
<rect class="purple" x="95" y="900" width="690" height="185" rx="18"/><circle cx="145" cy="950" r="30" fill="#9333ea"/><text class="h center white" x="145" y="959">6</text><text class="h" x="200" y="940">M2 单轴低速测试</text><text class="s" x="200" y="980">关闭 M1 动力，仅按同一流程验证 M2。</text><text class="s" x="200" y="1008">确认 PUL、DIR、ENA 未接串，方向与锁轴正常。</text><text class="xs" x="200" y="1045">通过：M2 可独立低速动作，驱动器不报警。</text>
<rect class="amber" x="1015" y="900" width="690" height="185" rx="18"/><circle cx="1065" cy="950" r="30" fill="#d97706"/><text class="h center white" x="1065" y="959">7</text><text class="h" x="1120" y="940">双轴、回零、低速轨迹</text><text class="s" x="1120" y="980">装回连杆，先手动确认工作空间。</text><text class="s" x="1120" y="1008">再执行回零、短直线和小范围轮廓。</text><text class="xs" x="1120" y="1045">通过：无硬碰撞、无奇异拉直，状态队列可正常清空。</text>
<path class="wire" d="M1360 835V900" marker-end="url(#arrow)"/><path class="wire" d="M1015 992H785" marker-end="url(#arrow)"/><path class="wire" d="M440 1085V1140" marker-end="url(#arrow)"/>
<rect class="red" x="415" y="1140" width="970" height="125" rx="18"/><circle cx="470" cy="1190" r="30" fill="#dc2626"/><text class="h center white" x="470" y="1199">8</text><text class="h" x="525" y="1185">最后才接激光：低占空比、遮光、防护到位</text><text class="s" x="525" y="1220">先用低功率替代负载验证继电器，再接 12 V 与激光头；</text><text class="s" x="525" y="1248">确认防护、急停和遮光到位，ARM 前绝不出光。</text>
<rect class="red" x="95" y="1310" width="1610" height="2"/>
<text class="s center" x="900" y="1340">停止条件：异常发热、焦味、驱动报警、无法急停、限位不变化、继电器安全态错误、机械干涉——立即断电，不要靠软件“继续试”。</text></svg>