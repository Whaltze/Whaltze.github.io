<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">M1 DM556 共阳逐线接线</title><desc id="desc">从 STM32F103、5V 逻辑电源、动力电源到 M1 DM556 和四线步进电机的每一根导线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:3}.amber{fill:#fef3c7;stroke:#d97706;stroke-width:3}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:3}.purple{fill:#f3e8ff;stroke:#9333ea;stroke-width:3}.gray{fill:#f1f5f9;stroke:#64748b;stroke-width:2}.wire{fill:none;stroke:#334155;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round}.power{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round}.ground{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round}.safe{fill:none;stroke:#16a34a;stroke-width:5;stroke-linecap:round}.dash{stroke-dasharray:10 8}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#475569}.h{font-size:26px;font-weight:700}.t{font-size:20px}.s{font-size:17px}.mono{font-family:Consolas,'Courier New',monospace}.center{text-anchor:middle}.right{text-anchor:end}.tag{font-size:16px;font-weight:700}</style><rect class="bg" width="1600" height="980"/><text class="title" x="60" y="62">M1：DM556 共阳接法，逐根线核对</text><text class="sub" x="60" y="98">PUL 也可能在实物上标为 PLS；“+”端共接 +5V_LOGIC，“−”端由 STM32 开漏输出下拉</text>
<rect class="panel" x="45" y="135" width="1510" height="770" rx="24"/><rect class="blue" x="80" y="205" width="330" height="405" rx="18"/><text class="h center" x="245" y="250">STM32F103</text><text class="t mono" x="125" y="315">PA8 / TIM1_CH1 → PUL−</text><text class="t mono" x="125" y="375">PB12 → DIR−</text><text class="t mono" x="125" y="435">PB13 → ENA−</text><text class="t mono" x="125" y="515">GND</text><text class="s" x="125" y="560">GPIO 为开漏；有效时吸电流到 GND</text>
<rect class="amber" x="80" y="680" width="330" height="145" rx="18"/><text class="h center" x="245" y="725">+5V_LOGIC</text><text class="t" x="125" y="770">正端：接三个 “+” 端</text><text class="t" x="125" y="807">负端：接 STM32 GND</text>
<rect class="purple" x="650" y="170" width="390" height="675" rx="18"/><text class="h center" x="845" y="215">DM556 · M1</text><rect class="gray" x="720" y="245" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="268">PUL+ / PLS+</text><rect class="gray" x="720" y="290" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="313">PUL− / PLS−</text><rect class="gray" x="720" y="335" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="358">DIR+</text><rect class="gray" x="720" y="380" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="403">DIR−</text><rect class="gray" x="720" y="425" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="448">ENA+</text><rect class="gray" x="720" y="470" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="493">ENA−</text><rect class="gray" x="720" y="515" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="538">VDC+（或 VCC）</text><rect class="gray" x="720" y="560" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="583">VDC−（或 GND）</text><rect class="gray" x="720" y="605" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="628">A+</text><rect class="gray" x="720" y="650" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="673">A−</text><rect class="gray" x="720" y="695" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="718">B+</text><rect class="gray" x="720" y="740" width="250" height="34" rx="5"/><text class="s center mono" x="845" y="763">B−</text>
<rect class="red" x="1180" y="180" width="310" height="170" rx="18"/><text class="h center" x="1335" y="225">24–48 V 动力电源</text><text class="t" x="1230" y="275">正极 → VDC+</text><text class="t" x="1230" y="315">负极 → VDC−</text>
<rect class="green" x="1180" y="500" width="310" height="280" rx="18"/><text class="h center" x="1335" y="545">M1 四线步进电机</text><text class="t" x="1230" y="600">线圈 1 首端 → A+</text><text class="t" x="1230" y="640">线圈 1 尾端 → A−</text><text class="t" x="1230" y="690">线圈 2 首端 → B+</text><text class="t" x="1230" y="730">线圈 2 尾端 → B−</text><text class="s" x="1230" y="765">导线颜色不得猜测</text>
<path class="signal" d="M410 310H650" marker-end="url(#blueArrow)"/><text class="tag center" x="530" y="293">PA8 / TIM1_CH1 → PUL−</text><path class="signal" d="M410 370H605V400H650" marker-end="url(#blueArrow)"/><text class="tag" x="430" y="354">PB12 → DIR−</text><path class="signal" d="M410 430H570V490H650" marker-end="url(#blueArrow)"/><text class="tag" x="430" y="414">PB13 → ENA−</text>
<path class="power" d="M410 735H540V262H650"/><path class="power" d="M540 352H650"/><path class="power" d="M540 442H650"/><text class="tag" x="425" y="710">+5V → PUL+、DIR+、ENA+</text><path class="ground" d="M410 785H500V515H410"/><text class="tag" x="430" y="810">5V− ↔ STM32 GND</text><path class="power" d="M1180 265H1040V577" marker-end="url(#redArrow)"/><path class="ground" d="M1180 310H1090V622H1040" marker-end="url(#arrow)"/><path class="wire" d="M1040 667H1125V585H1180" marker-end="url(#arrow)"/><path class="wire" d="M1040 712H1140V625H1180" marker-end="url(#arrow)"/><path class="wire" d="M1040 757H1155V685H1180" marker-end="url(#arrow)"/><path class="wire" d="M1040 802H1170V725H1180" marker-end="url(#arrow)"/>
<rect class="red" x="470" y="865" width="660" height="70" rx="14"/><text class="t center" x="800" y="908">断电检查：动力端无短路 → 线圈配对正确 → 5V 与 GND 正确 → 最后才给 DM556 上电</text></svg>